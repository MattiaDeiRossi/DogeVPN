services:

  vpnserver:
    build:
      context: ../
      dockerfile: server/Dockerfile
    tty: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - ALL
    sysctls:
      - net.ipv4.ip_forward=1
    container_name: server
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
      - DOGE_VPN_CONFIG_PATH=config.txt
    networks:
      external_network:
        ipv4_address: 10.5.42.15
      internal_network:
        ipv4_address: 192.168.42.15
    command: ./build/vpnserver

  server_host_a:
    image: handsonsecurity/seed-ubuntu:large
    tty: true
    cap_add:
      - ALL
    container_name: server_host_a
    networks:
      internal_network:
        ipv4_address: 192.168.42.16
    depends_on:
      - vpnserver
    command: sh -c "
                  ip route add 192.168.11.0/24 via 192.168.42.15 &&
                  /etc/init.d/openbsd-inetd start &&
                  tail -f /dev/null
              "

